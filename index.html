<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Analyzer · AI Environment</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
  :root {
    --bg-deep: #03060f;
    --bg: #050912;
    --bg2: #080d1a;
    --surface: rgba(15, 25, 45, 0.55);
    --surface-solid: #0c1428;
    --surface2: rgba(20, 35, 60, 0.6);
    --surface3: #14223e;
    --border: rgba(0, 229, 255, 0.14);
    --border-strong: rgba(0, 229, 255, 0.3);
    --border-soft: rgba(255, 255, 255, 0.05);
    --cyan: #00e5ff;
    --cyan-deep: #00b4d8;
    --blue: #0080ff;
    --blue-glow: rgba(0, 229, 255, 0.5);
    --gold: #fbbf24;
    --green: #10d9a0;
    --red: #f87171;
    --purple: #a78bfa;
    --pink: #ec4899;
    --text: #d8e3f0;
    --text-bright: #ffffff;
    --muted: #5a708a;
    --muted2: #8ba1bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* AI ENVIRONMENT BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 229, 255, 0.12), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(0, 128, 255, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 0% 100%, rgba(167, 139, 250, 0.06), transparent 60%);
    z-index: -2;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    background-position: -1px -1px;
    z-index: -1;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  .display { font-family: 'Syne', sans-serif; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(3, 6, 15, 0.7);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.2);
    position: relative;
  }
  .brand-logo::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-radius: 12px;
    z-index: -1;
    filter: blur(8px);
    opacity: 0.5;
  }
  .brand-name {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--text-bright);
    letter-spacing: 0.02em;
  }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .lang-switch {
    display: flex; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 999px; padding: 3px;
  }
  .lang-btn {
    padding: 5px 12px; font-size: 11px; font-weight: 700; border: 0; background: transparent;
    color: var(--muted2); border-radius: 999px; cursor: pointer; transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .lang-btn.active { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #000; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3); }
  .header-pill {
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    color: var(--text); background: var(--surface-solid); border: 1px solid var(--border);
    border-radius: 999px; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
    font-family: 'DM Sans', sans-serif; white-space: nowrap;
  }
  .header-pill:hover { border-color: var(--border-strong); color: var(--text-bright); box-shadow: 0 0 16px rgba(0, 229, 255, 0.2); }

  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }

  /* AI ENVIRONMENT FRAME COMPONENTS */
  .ai-card {
    position: relative;
    background: var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    overflow: hidden;
  }
  .ai-card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.5;
  }
  .ai-card-corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--cyan);
    border-style: solid;
    pointer-events: none;
    opacity: 0.6;
  }
  .ai-card-corner.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .ai-card-corner.tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
  .ai-card-corner.bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
  .ai-card-corner.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

  /* HERO SECTION (PAGE 1) */
  .hero {
    text-align: center;
    padding: 32px 0 48px;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: rgba(0, 229, 255, 0.05);
    border: 1px solid rgba(0, 229, 255, 0.25);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .hero-tag::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 18px;
    color: var(--text-bright);
  }
  .hero-title .gradient {
    background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hero-desc {
    max-width: 600px; margin: 0 auto;
    font-size: 16px;
    color: var(--muted2);
    line-height: 1.6;
  }

  /* INPUT GRID */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
  }
  @media (max-width: 800px) { .input-grid { grid-template-columns: 1fr; } }

  .input-card {
    display: flex; flex-direction: column;
    min-height: 480px;
  }
  .input-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
  }
  .input-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 128, 255, 0.1));
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cyan);
    flex-shrink: 0;
  }
  .input-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--cyan);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .input-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-bright);
  }

  /* UPLOAD ZONE */
  .upload-zone {
    flex: 1;
    border: 2px dashed var(--border-strong);
    border-radius: 14px;
    background: rgba(0, 229, 255, 0.02);
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    min-height: 320px;
  }
  .upload-zone:hover {
    border-color: var(--cyan);
    background: rgba(0, 229, 255, 0.04);
    box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.05);
  }
  .upload-zone.drag {
    border-color: var(--cyan);
    background: rgba(0, 229, 255, 0.08);
    transform: scale(1.01);
  }
  .upload-icon-glow {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    margin-bottom: 18px;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
    position: relative;
  }
  .upload-icon-glow::before {
    content: '';
    position: absolute;
    inset: -4px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border-radius: 50%;
    z-index: -1;
    filter: blur(12px);
    opacity: 0.4;
    animation: pulse-glow 3s infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }
  .upload-text {
    font-size: 15px; font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 6px;
  }
  .upload-subtext {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .upload-formats {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .format-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--cyan);
    letter-spacing: 0.05em;
  }

  /* FILE LOADED STATE */
  .file-loaded {
    flex: 1;
    background: rgba(16, 217, 160, 0.05);
    border: 1px solid rgba(16, 217, 160, 0.3);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .file-loaded-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
  }
  .file-loaded-icon {
    width: 44px; height: 44px;
    background: rgba(16, 217, 160, 0.15);
    border: 1px solid rgba(16, 217, 160, 0.4);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--green);
    flex-shrink: 0;
  }
  .file-loaded-info { flex: 1; min-width: 0; }
  .file-loaded-name {
    font-size: 13px; font-weight: 600;
    color: var(--text-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .file-loaded-stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 0.05em;
    display: flex;
    gap: 10px;
  }
  .file-loaded-remove {
    width: 28px; height: 28px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted2);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .file-loaded-remove:hover {
    background: rgba(248, 113, 113, 0.1);
    color: var(--red);
    border-color: rgba(248, 113, 113, 0.3);
  }

  .cv-preview {
    flex: 1;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    overflow-y: auto;
    font-size: 12px;
    color: var(--muted2);
    line-height: 1.65;
    font-family: 'DM Sans', sans-serif;
    white-space: pre-wrap;
    max-height: 200px;
  }

  .cv-or-paste {
    display: flex; align-items: center; gap: 12px;
    margin: 14px 0;
    color: var(--muted);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .cv-or-paste::before, .cv-or-paste::after {
    content: '';
    flex: 1; height: 1px;
    background: var(--border);
  }
  .paste-link {
    color: var(--cyan);
    background: transparent;
    border: 0;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .paste-link:hover { background: rgba(0, 229, 255, 0.1); }

  .text-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    min-height: 320px;
  }
  .text-input:focus {
    border-color: var(--cyan);
    box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.05);
  }
  .text-input::placeholder { color: var(--muted); font-style: italic; }

  .extracting-status {
    background: rgba(0, 229, 255, 0.05);
    border: 1px solid rgba(0, 229, 255, 0.3);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .extracting-text {
    font-size: 13px;
    color: var(--cyan);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }
  .extracting-error { background: rgba(248, 113, 113, 0.05); border-color: rgba(248, 113, 113, 0.3); }
  .extracting-error .extracting-text { color: var(--red); }

  /* CTA */
  .cta-section {
    text-align: center;
  }
  .btn-primary-big {
    padding: 18px 48px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #000;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: relative;
    overflow: hidden;
  }
  .btn-primary-big:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 50px rgba(0, 229, 255, 0.6);
  }
  .btn-primary-big:disabled {
    background: var(--surface3);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-primary-big::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.6s;
  }
  .btn-primary-big:hover::before { left: 100%; }

  .config-collapsed {
    max-width: 580px;
    margin: 24px auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .config-toggle {
    width: 100%;
    background: transparent;
    border: 0;
    padding: 14px 18px;
    color: var(--muted2);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: color 0.15s;
  }
  .config-toggle:hover { color: var(--text); }
  .config-toggle-left { display: flex; align-items: center; gap: 8px; }
  .config-body {
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
  }
  .config-body label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted2);
    margin: 12px 0 6px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .config-body input {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .config-body input:focus { border-color: var(--cyan); }
  .config-help { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .config-help a { color: var(--cyan); text-decoration: none; }
  .config-help a:hover { text-decoration: underline; }

  /* PROCESSING */
  .processing-screen {
    min-height: 70vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 60px 24px;
  }
  .ai-orb {
    width: 200px; height: 200px;
    position: relative;
    margin-bottom: 40px;
  }
  .ai-orb-ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--cyan);
    border-radius: 50%;
    opacity: 0.3;
    animation: orb-pulse 3s ease-out infinite;
  }
  .ai-orb-ring:nth-child(2) { animation-delay: 1s; }
  .ai-orb-ring:nth-child(3) { animation-delay: 2s; }
  @keyframes orb-pulse {
    0% { transform: scale(0.4); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .ai-orb-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 100px; height: 100px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, var(--cyan), var(--blue));
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.2);
    display: flex; align-items: center; justify-content: center;
    color: #000;
    animation: orb-rotate 4s linear infinite;
  }
  @keyframes orb-rotate { from { transform: translate(-50%, -50%) rotate(0); } to { transform: translate(-50%, -50%) rotate(360deg); } }

  .processing-title {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: var(--text-bright);
    margin-bottom: 12px;
  }
  .processing-step {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.05em;
    min-height: 20px;
    margin-bottom: 32px;
  }
  .processing-bar {
    width: 320px; height: 3px;
    background: var(--surface3);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
  }
  .processing-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    transition: width 0.5s ease;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.6);
  }

  /* RESULTS PAGE */
  .results-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .results-bar-left { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    color: var(--muted2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

// ============== UTILS ==============
function normalize(text) {
  return (text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function countPatternMatches(text, patterns) {
  const norm = normalize(text);
  let count = 0;
  const matched = [];
  for (const p of patterns) {
    const np = normalize(p);
    if (norm.includes(np)) {
      count++;
      matched.push(p);
    }
  }
  return { count, matched };
}

function getScoreColor(s) { return s < 50 ? '#f87171' : s < 70 ? '#fbbf24' : '#10d9a0'; }
function getScoreClass(s) { return s < 50 ? 'low' : s < 70 ? 'mid' : 'high'; }
function getMetricColor(pct) { return pct < 50 ? 'red' : pct < 70 ? 'gold' : 'green'; }

// ============== SMART SEMANTIC ANALYZER ==============
function smartAnalyze(cvText, jdText, lang) {
  // Step 1: Identify which categories the JD requires
  const jdMatches = {};
  for (const tax of TAXONOMY) {
    const r = countPatternMatches(jdText, tax.patterns);
    if (r.count > 0) jdMatches[tax.id] = r;
  }

  // Step 2: Check which of those categories the CV covers
  const cvMatches = {};
  for (const tax of TAXONOMY) {
    const r = countPatternMatches(cvText, tax.patterns);
    cvMatches[tax.id] = r;
  }

  // Step 3: Compute scores per macro-category
  let reqScore = 0, reqMax = 0;
  let expScore = 0, expMax = 0;
  let eduScore = 0, eduMax = 0;

  const categoryStatus = {};

  for (const tax of TAXONOMY) {
    const required = !!jdMatches[tax.id];
    const cvHas = cvMatches[tax.id].count > 0;
    const cvStrength = Math.min(cvMatches[tax.id].count, 4) / 4; // 0..1

    const targetCategory = tax.cat;
    if (!required) {
      // Not required by JD; still count partial credit if CV has it as bonus
      if (targetCategory === 'requirements') reqMax += 0;
      if (targetCategory === 'experience') expMax += 0;
      if (targetCategory === 'education') eduMax += 0;
      continue;
    }

    // It's required
    if (targetCategory === 'requirements') reqMax += tax.weight;
    if (targetCategory === 'experience') expMax += tax.weight;
    if (targetCategory === 'education') eduMax += tax.weight;

    const earned = cvHas ? Math.round(tax.weight * (0.65 + 0.35 * cvStrength)) : 0;
    if (targetCategory === 'requirements') reqScore += earned;
    if (targetCategory === 'experience') expScore += earned;
    if (targetCategory === 'education') eduScore += earned;

    categoryStatus[tax.id] = { required, cvHas, earned, max: tax.weight, label: lang === 'pt' ? tax.label : tax.labelEn, cvStrength };
  }

  // Cap scores and normalize
  // Map raw category scores to fixed denominators (40, 30, 20, 10)
  const reqPct = reqMax > 0 ? Math.min(100, Math.round((reqScore / reqMax) * 100)) : 60;
  const expPct = expMax > 0 ? Math.min(100, Math.round((expScore / expMax) * 100)) : 60;
  const eduPct = eduMax > 0 ? Math.min(100, Math.round((eduScore / eduMax) * 100)) : 60;

  const reqVal = Math.round((reqPct / 100) * 40);
  const expVal = Math.round((expPct / 100) * 30);
  const eduVal = Math.round((eduPct / 100) * 10);

  // Terms: vocabulary overlap (different metric)
  // Count unique top JD terms that appear in CV
  const jdTaxIds = Object.keys(jdMatches);
  const matchedTaxIds = jdTaxIds.filter(id => cvMatches[id].count > 0);
  const termsRatio = jdTaxIds.length > 0 ? matchedTaxIds.length / jdTaxIds.length : 0.7;
  const termsPct = Math.round(termsRatio * 100);
  const termsVal = Math.round(termsRatio * 20);

  const score = Math.min(100, reqVal + expVal + termsVal + eduVal);

  // Build present/missing keyword lists
  const present = [];
  const missing = [];
  for (const taxId of jdTaxIds) {
    const tax = TAXONOMY.find(t => t.id === taxId);
    const label = lang === 'pt' ? tax.label : tax.labelEn;
    if (cvMatches[taxId].count > 0) {
      present.push(label);
    } else {
      missing.push(label);
    }
  }

  // Build alerts (missing items, high impact first)
  const missingTax = jdTaxIds
    .filter(id => cvMatches[id].count === 0)
    .map(id => TAXONOMY.find(t => t.id === id))
    .sort((a, b) => b.weight - a.weight);

  const alerts = missingTax.slice(0, 4).map((tax, i) => {
    const label = lang === 'pt' ? tax.label : tax.labelEn;
    return {
      num: lang === 'pt' ? `FALHA 0${i+1}` : `GAP 0${i+1}`,
      text: lang === 'pt'
        ? `Falta evidência clara de ${label} no currículo. A vaga menciona explicitamente esse tema.`
        : `Missing clear evidence of ${label} in the resume. The job explicitly mentions this topic.`
    };
  });

  if (alerts.length === 0) {
    alerts.push({
      num: lang === 'pt' ? 'OBSERVAÇÃO' : 'NOTE',
      text: lang === 'pt'
        ? 'Currículo bem alinhado à vaga. Refinamentos de linguagem ainda podem otimizar a triagem ATS.'
        : 'Resume well-aligned to the job. Language refinements can still optimize ATS screening.'
    });
  }

  // Strengths (top categories with strong matches)
  const presentTax = jdTaxIds
    .filter(id => cvMatches[id].count > 0)
    .map(id => ({ ...TAXONOMY.find(t => t.id === id), strength: cvMatches[id].count }))
    .sort((a, b) => b.weight * b.strength - a.weight * a.strength);

  const strengths = presentTax.slice(0, 4).map(tax => {
    const label = lang === 'pt' ? tax.label : tax.labelEn;
    if (tax.strength >= 3) {
      return lang === 'pt'
        ? `Forte cobertura em ${label} — múltiplas evidências no currículo.`
        : `Strong coverage in ${label} — multiple evidences in the resume.`;
    }
    return lang === 'pt'
      ? `Boa presença de ${label} no histórico profissional.`
      : `Good presence of ${label} in professional history.`;
  });

  // Build the optimizer / adapted summary
  const presentLabels = present.slice(0, 4).join(', ');
  const missingLabels = missing.slice(0, 3).join(', ');

  const optimizerSuggestion = lang === 'pt'
    ? `Profissional sênior com sólida trajetória em liderança de transformação digital em ambientes corporativos regulados, consolidando expertise progressiva em ${presentLabels}, com atuação direta na ponte entre tecnologia, áreas de negócio e alta liderança. ${missing.length > 0 ? `Atuação estratégica integrando ${missingLabels} para estruturação, avaliação e priorização de casos de uso de alto impacto, alinhados a objetivos institucionais e geração de valor mensurável. ` : ''}Coordenação de projetos transversais com múltiplos stakeholders, governança técnica responsável sob frameworks como SAFe, Scrum e Kanban, aderência a SLOs de performance e arquitetura de soluções com foco em ROI operacional e maturidade organizacional.`
    : `Senior professional with solid digital transformation leadership track record in regulated corporate environments, consolidating progressive expertise in ${presentLabels}, with direct action as a bridge between technology, business areas and senior leadership. ${missing.length > 0 ? `Strategic action integrating ${missingLabels} for structuring, evaluating and prioritizing high-impact use cases, aligned with institutional objectives and measurable value generation. ` : ''}Coordination of cross-functional projects with multiple stakeholders, responsible technical governance under frameworks like SAFe, Scrum and Kanban, adherence to performance SLOs and solution architecture focused on operational ROI and organizational maturity.`;

  // Job title extraction
  const firstLine = (jdText.split('\n').find(l => l.trim().length > 5) || '').trim();
  let jobTitle = firstLine.length > 70 ? firstLine.slice(0, 67) + '...' : firstLine;
  const titleMatch = jdText.match(/Buscamos um[a]?\s+([^,\.\n]+)/i)
    || jdText.match(/We[\'']?re looking for\s+([^,\.\n]+)/i)
    || jdText.match(/Vaga\s+(?:de|para)\s+([^,\.\n]+)/i);
  if (titleMatch) jobTitle = titleMatch[1].trim().slice(0, 70);

  return {
    score,
    jobTitle: jobTitle || (lang === 'pt' ? 'Vaga' : 'Job'),
    timestamp: Date.now(),
    metrics: {
      requirements: { val: reqVal, total: 40, pct: Math.round((reqVal/40)*100), label: lang === 'pt' ? 'Requisitos' : 'Requirements', desc: lang === 'pt' ? 'Cobertura dos requisitos centrais da vaga.' : 'Coverage of central job requirements.', color: getMetricColor((reqVal/40)*100) },
      experience: { val: expVal, total: 30, pct: Math.round((expVal/30)*100), label: lang === 'pt' ? 'Experiência' : 'Experience', desc: lang === 'pt' ? 'Maturidade profissional alinhada à vaga.' : 'Professional maturity aligned with the job.', color: getMetricColor((expVal/30)*100) },
      terms: { val: termsVal, total: 20, pct: termsPct, label: lang === 'pt' ? 'Termos' : 'Terms', desc: lang === 'pt' ? 'Vocabulário do CV alinhado à vaga.' : 'CV vocabulary aligned with the job.', color: getMetricColor(termsPct) },
      education: { val: eduVal, total: 10, pct: Math.round((eduVal/10)*100), label: lang === 'pt' ? 'Formação' : 'Education', desc: lang === 'pt' ? 'Formação e certificações pertinentes.' : 'Relevant education and certifications.', color: getMetricColor((eduVal/10)*100) }
    },
    alerts,
    strengths,
    keywords: { present, missing },
    keywordsDesc: lang === 'pt'
      ? `Match semântico entre ${jdTaxIds.length} categorias-chave da vaga e o conteúdo do currículo. ${matchedTaxIds.length} categorias presentes, ${jdTaxIds.length - matchedTaxIds.length} ausentes.`
      : `Semantic match between ${jdTaxIds.length} key job categories and CV content. ${matchedTaxIds.length} categories present, ${jdTaxIds.length - matchedTaxIds.length} missing.`,
    optimizerSuggestion,
    integratedTerms: missing.slice(0, 5)
  };
}

// ============== FILE EXTRACTION ==============
async function extractText(file) {
  const ext = file.name.toLowerCase().split('.').pop();
  if (ext === 'pdf') return extractPdfText(file);
  if (ext === 'docx' || ext === 'doc') return extractDocxText(file);
  if (ext === 'txt') return file.text();
  throw new Error('Formato não suportado');
}

async function extractPdfText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const pdf = await window.pdfjsLib.getDocument({ data: e.target.result }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const tc = await page.getTextContent();
          text += tc.items.map(it => it.str).join(' ') + '\n\n';
        }
        if (text.trim().length < 50) reject(new Error('PDF sem texto extraível (pode ser scan).'));
        else resolve(text.trim());
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Falha na leitura'));
    reader.readAsArrayBuffer(file);
  });
}

async function extractDocxText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const result = await window.mammoth.extractRawText({ arrayBuffer: e.target.result });
        if (result.value && result.value.trim().length >= 50) {
          resolve(result.value.trim());
        } else {
          reject(new Error('Documento sem texto extraível.'));
        }
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Falha na leitura'));
    reader.readAsArrayBuffer(file);
  });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

// ============== DONUT ==============
function Donut({ pct, size=200, stroke=14, color, showValue, value, valueSize, label }) {
  const radius = (size - stroke) / 2;
  const circ = 2 * Math.PI * radius;
  const [progress, setProgress] = useState(0);
  useEffect(() => { setTimeout(() => setProgress(pct), 100); }, [pct]);
  const offset = circ - (progress / 100) * circ;
  return (
    <div style={{position:'relative', display:'inline-flex', alignItems:'center', justifyContent:'center', width:size, height:size}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
        <defs>
          <filter id={`glow-${color.replace('#','')}`}>
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle cx={size/2} cy={size/2} r={radius} stroke="rgba(0, 229, 255, 0.08)" strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={radius} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          filter={`url(#glow-${color.replace('#','')})`}
          style={{ transition: 'stroke-dashoffset 1.4s cubic-bezier(0.4, 0, 0.2, 1)', filter: `drop-shadow(0 0 8px ${color})` }}/>
      </svg>
      {showValue && (
        <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
          {label && <div style={{fontFamily:'JetBrains Mono, monospace', fontSize:9, color:'var(--muted)', letterSpacing:'0.18em', textTransform:'uppercase', marginBottom:4}}>{label}</div>}
          <div className="display" style={{fontSize: valueSize || size/3.2, fontWeight:800, color:'var(--text-bright)', lineHeight:1, textShadow:`0 0 20px ${color}50`}}>
            {value !== undefined ? value : pct}
          </div>
        </div>
      )}
    </div>
  );
}

function MiniMetric({ value, total, color, label }) {
  const pct = (value / total) * 100;
  return (
    <div className="mini-stat">
      <Donut pct={pct} size={64} stroke={4} color={color} showValue value={value} valueSize={17}/>
      <div className="mini-stat-label">{label}</div>
    </div>
  );
}

// ============== PROCESSING ==============
function ProcessingPage({ t }) {
  const [stepIdx, setStepIdx] = useState(0);
  const [progress, setProgress] = useState(15);
  useEffect(() => {
    const total = t.processingSteps.length;
    const interval = setInterval(() => {
      setStepIdx(prev => {
        const next = Math.min(prev + 1, total - 1);
        setProgress(((next + 1) / total) * 95);
        return next;
      });
    }, 900);
    return () => clearInterval(interval);
  }, []);
  return (
    <div className="processing-screen">
      <div className="ai-orb">
        <div className="ai-orb-ring"/>
        <div className="ai-orb-ring"/>
        <div className="ai-orb-ring"/>
        <div className="ai-orb-core"><Icon name="cpu" size={36}/></div>
      </div>
      <h2 className="processing-title">{t.processingTitle}</h2>
      <div className="processing-step">{t.processingSteps[stepIdx]}</div>
      <div className="processing-bar">
        <div className="processing-bar-fill" style={{width: `${progress}%`}}/>
      </div>
    </div>
  );
}

          <MetricCard data={r.metrics.terms} icon="sparkles" t={t}/>

              {r.alerts.map((a, i) => (
                <div key={i} className="gap-item">
                  <div className="gap-icon-circle"><Icon name="x" size={14}/></div>
                  <div style={{flex:1}}>
                    <div className="gap-num">{a.num}</div>
                    <div className="gap-text">{a.text}</div>
                  </div>

        {r.strengths && r.strengths.length > 0 && (
          <div className="ai-card strength-card">

            <div className="ai-card-corner bl"/><div className="ai-card-corner br"/>

              <div className="section-icon-box icon-green"><Icon name="checkCircle" size={18}/></div>

                <div className="section-title">{t.strengths}</div>
              </div>
            </div>
            <div className="gap-list">
              {r.strengths.map((s, i) => <div key={i} className="strength-item">{s}</div>)}
            </div>
          </div>
        )}

        <div className="ai-card">
          <div className="ai-card-corner tl"/><div className="ai-card-corner tr"/>
          <div className="ai-card-corner bl"/><div className="ai-card-corner br"/>
          <div className="keywords-head">
            <div className="section-head" style={{margin:0}}>
              <div className="section-icon-box icon-gold"><Icon name="alert" size={18}/></div>
              <div>
                <div className={`section-cat keywords-cat`}>{t.jobLanguage}</div>
                <div className="section-title">{t.jobTerms}</div>
              </div>
            </div>
            <div className="coverage-display">
              <div className="coverage-row">
                <span className="coverage-label">{t.coverage}</span>
                <span className="coverage-val" style={{color: COLORS[r.metrics.terms.color]}}>{r.metrics.terms.val}/{r.metrics.terms.total}</span>
              </div>
              <div className="progress-track" style={{width: 160}}>
                <div className={`progress-fill ${r.metrics.terms.color}`} style={{width: `${r.metrics.terms.pct}%`}}/>
              </div>
            </div>
          </div>
          <p className="keywords-desc">{r.keywordsDesc}</p>
          <div className="keywords-grid">
            <div>
              <div className="kw-label green">{t.presentInResume}</div>
              <p className="kw-desc">{t.presentDesc}</p>
              <div className="tags-wrap">
                {r.keywords.present.length === 0 ? <span style={{color:'var(--muted)', fontSize:12}}>—</span> :
                  r.keywords.present.map((k, i) => <span key={i} className="tag tag-green">{k}</span>)}

            </div>
            <div>
              <div className="kw-label red">{t.absentInResume}</div>
              <p className="kw-desc">{t.absentDesc}</p>
              <div className="tags-wrap">
                {r.keywords.missing.length === 0 ? <span style={{color:'var(--muted)', fontSize:12}}>— Excelente cobertura</span> :
                  r.keywords.missing.map((k, i) => <span key={i} className="tag tag-red">{k}</span>)}
              </div>
            </div>
          </div>
        </div>

        <div className="cta-adapt-card">
          <div className="cta-adapt-tag">
            <Icon name="zap" size={11}/>
            {t.nextStep}
          </div>
          <h3 className="cta-adapt-title">{t.adaptCVTitle}</h3>
          <p className="cta-adapt-desc">{t.adaptCVDesc}</p>
          <div className="cta-adapt-buttons">
            <button className="btn-adapt-primary" onClick={() => setAdaptOpen(true)}>
              <Icon name="sparkles" size={14}/>
              {t.adaptCVBtn}

            <button className="btn-adapt-secondary" onClick={onNew}>

            </button>
          </div>

      </div>

      <AdaptModal isOpen={adaptOpen} onClose={() => setAdaptOpen(false)} t={t}
        suggestion={r.optimizerSuggestion} integratedTerms={r.integratedTerms}/>

      <RewriteModal isOpen={rewriteOpen} onClose={() => setRewriteOpen(false)} t={t}
        cvText={cvText} jdText={jdText} missingKeywords={r.keywords?.missing || []} apiKey={apiKey}/>
    </div>
  );

// ============== CLAUDE API ANALYZER ==============
async function claudeAnalyze(cvText, jdText, lang, apiKey) {
  const prompt = lang === 'pt'
    ? `Você é um especialista em ATS (Applicant Tracking Systems) e recrutamento. Analise a aderência entre o currículo e a vaga abaixo.

CURRÍCULO:
${cvText.slice(0, 3000)}

DESCRIÇÃO DA VAGA:
${jdText.slice(0, 2000)}

Responda APENAS com um JSON válido no seguinte formato (sem markdown, sem explicações fora do JSON):
{
  "score": <número 0-100>,
  "jobTitle": "<título da vaga>",
  "summary": "<análise de 2-3 frases>",
  "metrics": {
    "requirements": { "val": <0-40>, "total": 40, "desc": "<descrição>" },
    "experience": { "val": <0-30>, "total": 30, "desc": "<descrição>" },
    "terms": { "val": <0-20>, "total": 20, "desc": "<descrição>" },
    "education": { "val": <0-10>, "total": 10, "desc": "<descrição>" }
  },
  "alerts": [{"num": "FALHA 01", "text": "<descrição>"}],
  "strengths": ["<ponto forte 1>", "<ponto forte 2>"],
  "keywords": {
    "present": ["<termo presente>"],
    "missing": ["<termo ausente>"]
  },
  "optimizerSuggestion": "<parágrafo executivo de resumo profissional otimizado>",
  "integratedTerms": ["<termo integrado>"]
}`
    : `You are an ATS (Applicant Tracking Systems) and recruitment expert. Analyze the match between the resume and job below.

RESUME:
${cvText.slice(0, 3000)}

JOB DESCRIPTION:
${jdText.slice(0, 2000)}

Respond ONLY with valid JSON in this format (no markdown, no explanations outside the JSON):
{
  "score": <number 0-100>,
  "jobTitle": "<job title>",
  "summary": "<2-3 sentence analysis>",
  "metrics": {
    "requirements": { "val": <0-40>, "total": 40, "desc": "<description>" },
    "experience": { "val": <0-30>, "total": 30, "desc": "<description>" },
    "terms": { "val": <0-20>, "total": 20, "desc": "<description>" },
    "education": { "val": <0-10>, "total": 10, "desc": "<description>" }
  },
  "alerts": [{"num": "GAP 01", "text": "<description>"}],
  "strengths": ["<strength 1>", "<strength 2>"],
  "keywords": {
    "present": ["<present term>"],
    "missing": ["<missing term>"]
  },
  "optimizerSuggestion": "<optimized executive professional summary paragraph>",
  "integratedTerms": ["<integrated term>"]
}`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 2000, messages: [{ role: 'user', content: prompt }] })
  });
  if (!resp.ok) throw new Error('Erro na API: ' + resp.status);
  const data = await resp.json();
  const text = data.content[0].text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(text);
  // Enrich with computed fields
  const addMetaFields = (m) => {
    m.pct = Math.round((m.val / m.total) * 100);
    m.color = getMetricColor(m.pct);
    return m;
  };
  ['requirements','experience','terms','education'].forEach(k => {
    const labels = lang === 'pt'
      ? { requirements: 'Requisitos', experience: 'Experiência', terms: 'Termos', education: 'Formação' }
      : { requirements: 'Requirements', experience: 'Experience', terms: 'Terms', education: 'Education' };
    parsed.metrics[k].label = labels[k];
    addMetaFields(parsed.metrics[k]);
  });
  parsed.timestamp = Date.now();
  parsed.analyzedBy = 'claude';
  parsed.keywordsDesc = lang === 'pt'
    ? `Análise profunda com Claude AI. ${parsed.keywords.present.length} termos presentes, ${parsed.keywords.missing.length} ausentes.`
    : `Deep analysis with Claude AI. ${parsed.keywords.present.length} terms present, ${parsed.keywords.missing.length} missing.`;
  return parsed;
}

// ============== CV REWRITE WITH CLAUDE ==============
async function claudeRewriteCV(cvText, jdText, missingKeywords, lang, apiKey) {
  const prompt = lang === 'pt'
    ? `Você é um especialista sênior em currículos executivos e em sistemas ATS brasileiros (Gupy/GAIA, Microsoft, sistemas de RH). Reescreva o currículo abaixo para maximizar a aderência à vaga e passar em qualquer ATS, mantendo voz humana e natural.

CURRÍCULO ORIGINAL:
${cvText.slice(0, 8000)}

DESCRIÇÃO DA VAGA:
${jdText.slice(0, 3000)}

TERMOS IMPORTANTES AUSENTES: ${missingKeywords.join(', ')}

REGRAS DE ATS (obrigatórias):
- Cada bullet começa com verbo de ação + resultado quantificado + contexto, em no máximo 2 frases.
- Tempo verbal: pretérito para cargos passados (Liderei, Reduzi, Implementei, Gerenciei, Otimizei, Aumentei, Desenvolvi, Negociei); presente para o cargo atual. NUNCA use futuro — nada de "Liderarei", "Otimizarei", "Gerenciarei".
- Proibido: "responsável por", "ajudei", "participei", "fui responsável", "atuei em".
- Métricas em % (40%, 95%), R$ (R$ 50M+), quantidades (60+ profissionais), tempo (18 meses), disponibilidade (99,9%).
- NÃO invente números. Use apenas os que já existem no CV. Onde faltar uma métrica relevante, escreva o marcador [quantificar: ex. 40%] para o candidato preencher com dado real. Jamais fabrique resultados.
- Integre as palavras-chave exatas da vaga dentro das frases (não como lista solta). Use sinônimos quando soar natural (Gestão / Gerenciamento; Liderança / Mentoria).
- Resumo: 3-4 linhas, com cargo-alvo específico + anos de experiência + 2-3 resultados mensuráveis. Sem "em busca de oportunidade", "disponível para", "flexível".
- Competências: 5-8 categorias, 3-5 itens cada, separadas por " | ".
- Seções com nomes simples: Resumo, Experiência, Competências, Formação, Certificações, Idiomas. Consolide formações redundantes (2-3) e priorize 8-12 certificações.

VOZ HUMANA (anti-IA):
- Varie o tamanho das frases. Sem ritmo repetitivo nem estruturas simétricas.
- Proibidas frases típicas de IA: "no mundo de hoje", "é importante destacar", "não apenas... mas também", "em conclusão", "potencialize", "transforme seu", "descubra como".
- Linguagem direta, como alguém que de fato executou o trabalho. Sem conclusões arrumadas demais nem tom de manual.

Responda APENAS com JSON válido, sem markdown, sem texto fora do JSON:
{
  "summary": "<resumo profissional reescrito, 3-4 linhas>",
  "experience": "<bullets reescritos da experiência, um por linha, cada um começando com '• ', verbo no início + métrica + contexto>",
  "skills": "<5-8 linhas no formato 'Categoria: item | item | item', uma categoria por linha>",
  "keywords": "<palavras-chave exatas da vaga a incluir no CV, separadas por vírgula>",
  "checklist": "<ajustes estruturais no arquivo final: número de páginas, PDF em texto (não imagem), 1 coluna sem tabelas, consolidar formações, top 8-12 certificações, remover foto e dados pessoais (CPF/RG/idade), e onde preencher os marcadores [quantificar]>"
}`
    : `You are a senior expert in executive resumes and ATS systems (Gupy/GAIA, Microsoft, HR systems). Rewrite the resume below to maximize job match and pass any ATS, while keeping a natural human voice.

ORIGINAL RESUME:
${cvText.slice(0, 8000)}

JOB DESCRIPTION:
${jdText.slice(0, 3000)}

IMPORTANT MISSING TERMS: ${missingKeywords.join(', ')}

ATS RULES (mandatory):
- Each bullet starts with an action verb + quantified result + context, in at most 2 sentences.
- Verb tense: past tense for past roles (Led, Reduced, Implemented, Managed, Optimized, Increased, Developed, Negotiated); present for the current role. NEVER use future tense.
- Forbidden: "responsible for", "helped with", "participated in", "worked on".
- Metrics in % (40%, 95%), currency (US$ 50M+), counts (60+ professionals), time (18 months), uptime (99.9%).
- Do NOT invent numbers. Use only those already in the resume. Where a relevant metric is missing, write the marker [quantify: e.g. 40%] for the candidate to fill with real data. Never fabricate results.
- Integrate the job's exact keywords inside sentences (not as a loose list). Use synonyms when natural.
- Summary: 3-4 lines, specific target role + years of experience + 2-3 measurable results. No "seeking opportunity", "available for", "flexible".
- Skills: 5-8 categories, 3-5 items each, separated by " | ".
- Simple section names: Summary, Experience, Skills, Education, Certifications, Languages. Consolidate redundant education (2-3) and prioritize 8-12 certifications.

HUMAN VOICE (anti-AI):
- Vary sentence length. No repetitive rhythm or symmetric structures.
- Forbidden AI phrases: "in today's world", "it's important to highlight", "not only... but also", "in conclusion", "unlock", "transform your", "discover how".
- Direct language, like someone who actually did the work. No overly tidy conclusions.

Respond ONLY with valid JSON, no markdown, no text outside the JSON:
{
  "summary": "<rewritten professional summary, 3-4 lines>",
  "experience": "<rewritten experience bullets, one per line, each starting with '• ', verb first + metric + context>",
  "skills": "<5-8 lines in the format 'Category: item | item | item', one category per line>",
  "keywords": "<exact job keywords to include in the CV, comma separated>",
  "checklist": "<structural fixes for the final file: page count, text PDF (not image), single column no tables, consolidate education, top 8-12 certifications, remove photo and personal data, and where to fill the [quantify] markers>"
}`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 4096, messages: [{ role: 'user', content: prompt }] })
  });
  if (!resp.ok) throw new Error('API error: ' + resp.status);
  const data = await resp.json();
  const text = data.content[0].text.replace(/```json|```/g, '').trim();
  return JSON.parse(text);
}

// ============== HISTORY UTILS ==============
const HISTORY_KEY = 'ats_history_v1';
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}
function saveToHistory(result) {
  const h = loadHistory();
  const entry = { id: Date.now(), ...result };
  h.unshift(entry);
  const trimmed = h.slice(0, 20);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
}
function deleteFromHistory(id) {
  const h = loadHistory().filter(e => e.id !== id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}
function clearHistory() { localStorage.removeItem(HISTORY_KEY); }

// ============== EXPORT PDF ==============
function exportPDF(result, t) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, margin = 20, cw = W - margin * 2;

  // Colors
  const cyan = [0, 229, 255];
  const dark = [5, 9, 18];
  const white = [255, 255, 255];
  const muted = [90, 112, 138];
  const green = [16, 217, 160];
  const red = [248, 113, 113];
  const gold = [251, 191, 36];

  // Background
  doc.setFillColor(...dark);
  doc.rect(0, 0, 210, 297, 'F');

  // Header bar
  doc.setFillColor(8, 13, 26);
  doc.rect(0, 0, 210, 22, 'F');
  doc.setTextColor(...cyan);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text('ATS ANALYZER', margin, 14);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(...muted);
  doc.text('AI · POWERED', margin + 58, 14);
  doc.setTextColor(...muted);
  doc.text(new Date().toLocaleDateString(), W - margin, 14, { align: 'right' });

  let y = 34;

  // Job title
  doc.setTextColor(...white);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  const title = result.jobTitle || 'Análise ATS';
  doc.text(title.slice(0, 50), margin, y);
  y += 10;

  // Score badge
  const scoreColor = result.score >= 70 ? green : result.score >= 50 ? gold : red;
  doc.setFillColor(...scoreColor);
  doc.roundedRect(margin, y, 40, 18, 3, 3, 'F');
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(20);
  doc.setFont('helvetica', 'bold');
  doc.text(result.score + '%', margin + 20, y + 12, { align: 'center' });
  doc.setFontSize(9);
  doc.setTextColor(...muted);
  doc.text(t.compatibility, margin + 46, y + 5);
  const statusLabel = result.score >= 70 ? t.statusHigh : result.score >= 50 ? t.statusMid : t.statusLow;
  doc.setTextColor(...scoreColor);
  doc.setFont('helvetica', 'bold');
  doc.text(statusLabel, margin + 46, y + 12);
  y += 26;

  // Divider
  doc.setDrawColor(...cyan);
  doc.setLineWidth(0.3);
  doc.line(margin, y, W - margin, y);
  y += 8;

  // Metrics
  doc.setTextColor(...cyan);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.text('MÉTRICAS DE ADERÊNCIA', margin, y);
  y += 6;
  const metrics = [
    { label: t.requirements, val: result.metrics.requirements.val, total: 40, color: result.metrics.requirements.color },
    { label: t.experience, val: result.metrics.experience.val, total: 30, color: result.metrics.experience.color },
    { label: t.terms, val: result.metrics.terms.val, total: 20, color: result.metrics.terms.color },
    { label: t.education, val: result.metrics.education.val, total: 10, color: result.metrics.education.color },
  ];
  const colW = cw / 2;
  metrics.forEach((m, i) => {
    const col = i % 2; const row = Math.floor(i / 2);
    const mx = margin + col * colW;
    const my = y + row * 22;
    const pct = Math.round((m.val / m.total) * 100);
    const mc = m.color === 'green' ? green : m.color === 'gold' ? gold : red;
    doc.setTextColor(...white);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.text(m.label, mx, my + 4);
    doc.setTextColor(...mc);
    doc.setFontSize(9);
    doc.text(`${m.val}/${m.total} (${pct}%)`, mx + colW - 4, my + 4, { align: 'right' });
    doc.setFillColor(20, 34, 62);
    doc.roundedRect(mx, my + 6, colW - 8, 3, 1, 1, 'F');
    doc.setFillColor(...mc);
    doc.roundedRect(mx, my + 6, (colW - 8) * pct / 100, 3, 1, 1, 'F');
  });
  y += metrics.length > 2 ? 50 : 30;

  doc.setDrawColor(...cyan);
  doc.line(margin, y, W - margin, y);
  y += 8;

  // Keywords
  if (result.keywords) {
    doc.setTextColor(...cyan);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('TERMOS PRESENTES', margin, y);
    y += 5;
    doc.setTextColor(...green);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    const presentText = (result.keywords.present || []).join(' · ');
    const pLines = doc.splitTextToSize(presentText || '—', cw);
    doc.text(pLines.slice(0, 2), margin, y);
    y += pLines.slice(0, 2).length * 4 + 4;

    doc.setTextColor(...cyan);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('TERMOS AUSENTES', margin, y);
    y += 5;
    doc.setTextColor(...red);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    const missingText = (result.keywords.missing || []).join(' · ');
    const mLines = doc.splitTextToSize(missingText || '—', cw);
    doc.text(mLines.slice(0, 2), margin, y);
    y += mLines.slice(0, 2).length * 4 + 6;
  }

  doc.setDrawColor(...cyan);
  doc.line(margin, y, W - margin, y);
  y += 8;

  // Alerts
  if (result.alerts && result.alerts.length > 0) {
    doc.setTextColor(...red);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('PONTOS DE ATENÇÃO', margin, y);
    y += 5;
    result.alerts.slice(0, 3).forEach(a => {
      doc.setTextColor(...muted);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'bold');
      doc.text(a.num + '  ', margin, y + 3);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...white);
      const lines = doc.splitTextToSize(a.text, cw - 20);
      doc.text(lines.slice(0, 2), margin + 20, y + 3);
      y += lines.slice(0, 2).length * 4 + 4;
    });
    y += 4;
  }

  // Optimizer suggestion
  if (result.optimizerSuggestion) {
    doc.setDrawColor(...cyan);
    doc.line(margin, y, W - margin, y);
    y += 8;
    doc.setTextColor(...cyan);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('RESUMO PROFISSIONAL OTIMIZADO', margin, y);
    y += 5;
    doc.setTextColor(...white);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    const oLines = doc.splitTextToSize(result.optimizerSuggestion, cw);
    doc.text(oLines.slice(0, 8), margin, y);
  }

  // Footer
  doc.setFillColor(8, 13, 26);
  doc.rect(0, 285, 210, 12, 'F');
  doc.setTextColor(...muted);
  doc.setFontSize(7);
  doc.text('ATS ANALYZER · AI POWERED · jobhuntats.netlify.app', W / 2, 292, { align: 'center' });

  doc.save(`ATS_Report_${(result.jobTitle || 'analysis').replace(/[^a-z0-9]/gi, '_').slice(0, 30)}.pdf`);
}

// ============== HISTORY MODAL ==============
function HistoryModal({ isOpen, onClose, onLoad, t }) {
  const [history, setHistory] = useState([]);
  useEffect(() => { if (isOpen) setHistory(loadHistory()); }, [isOpen]);
  if (!isOpen) return null;
  const del = (id) => { deleteFromHistory(id); setHistory(loadHistory()); };
  const clearAll = () => { clearHistory(); setHistory([]); };
  const scoreColor = (s) => s >= 70 ? '#10d9a0' : s >= 50 ? '#fbbf24' : '#f87171';
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-icon"><Icon name="briefcase" size={20}/></div>
          <div className="modal-text">
            <div className="modal-tag">HISTÓRICO</div>
            <h3 className="modal-title">{t.historyTitle}</h3>
          </div>
          <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          {history.length === 0
            ? <div className="history-empty">{t.historyEmpty}</div>
            : <div className="history-list">
                {history.map(h => (
                  <div key={h.id} className="history-item" onClick={() => { onLoad(h); onClose(); }}>
                    <div className="history-score-badge" style={{background: `${scoreColor(h.score)}20`, color: scoreColor(h.score), border: `1px solid ${scoreColor(h.score)}50`}}>
                      {h.score}%
                    </div>
                    <div className="history-info">
                      <div className="history-job">{h.jobTitle}</div>
                      <div className="history-date">{new Date(h.timestamp).toLocaleString()}</div>
                    </div>
                    <button className="history-del" onClick={e => { e.stopPropagation(); del(h.id); }}><Icon name="close" size={12}/></button>
                  </div>
                ))}
              </div>
          }
        </div>
        <div className="modal-foot">
          {history.length > 0 && <button className="btn-ghost" onClick={clearAll} style={{color:'var(--red)'}}>{t.historyClear}</button>}
          <button className="btn-ghost" onClick={onClose}>{t.close}</button>
        </div>
      </div>
    </div>
  );
}

// ============== REWRITE MODAL ==============
function RewriteModal({ isOpen, onClose, t, cvText, jdText, missingKeywords, apiKey }) {
  const [loading, setLoading] = useState(false);
  const [rewrite, setRewrite] = useState(null);
  const [error, setError] = useState(null);
  const [copied, setCopied] = useState('');

  useEffect(() => {
    if (isOpen && apiKey && !rewrite && !loading) {
      setLoading(true); setError(null);
      claudeRewriteCV(cvText, jdText, missingKeywords, t === i18n.pt ? 'pt' : 'en', apiKey)
        .then(r => { setRewrite(r); setLoading(false); })
        .catch(e => { setError(e.message); setLoading(false); });
    }
  }, [isOpen]);

  if (!isOpen) return null;

  const copySection = (key, text) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(''), 2000);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()} style={{maxWidth: 680}}>
        <div className="modal-head">
          <div className="modal-icon"><Icon name="edit" size={20}/></div>
          <div className="modal-text">
            <div className="modal-tag">CLAUDE AI</div>
            <h3 className="modal-title">{t.rewriteTitle}</h3>
            <p className="modal-desc">{t.rewriteDesc}</p>
          </div>
          <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        </div>
        <div className="modal-body">
          {!apiKey && <div className="rewrite-no-key">{t.rewriteNoKey}<br/><a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a></div>}
          {apiKey && loading && (
            <div className="rewrite-loading">
              <div className="spinner" style={{width:32,height:32,borderWidth:3}}/>
              <div className="rewrite-loading-text">{t.rewriteLoading}</div>
            </div>
          )}
          {apiKey && error && <div className="rewrite-no-key" style={{color:'var(--red)'}}>Erro: {error}</div>}
          {apiKey && rewrite && (
            <div className="rewrite-sections">
              {[['summary', t.rwSummary], ['experience', t.rwExperience], ['skills', t.rwSkills], ['keywords', t.rwKeywords], ['checklist', t.rwChecklist]].filter(([key]) => rewrite[key]).map(([key, label]) => (
                <div key={key} className="rewrite-section-card">
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
                    <div className="rewrite-section-label">{label}</div>
                    <button className={`btn-copy ${copied===key?'copied':''}`} style={{fontSize:11,padding:'5px 10px'}} onClick={() => copySection(key, rewrite[key])}>
                      <Icon name={copied===key?'check':'copy'} size={12}/>
                      {copied===key ? t.copied : t.copyText}
                    </button>
                  </div>
                  <div className="rewrite-section-text">{rewrite[key]}</div>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn-ghost" onClick={onClose}>{t.close}</button>
        </div>
      </div>
    </div>
  );
}

  const tabs = [
    { id: 'analyze', label: '🔍 Analisar CV' },
    { id: 'history', label: '📂 Histórico', badge: historyCount },
    { id: 'rewrite', label: '✍️ Reescrever CV' },
    { id: 'salary', label: '💰 Salário' },
    { id: 'config', label: '⚙️ Configuração' },
  ];
  return (
    <div style={{display:'flex',gap:6,padding:'0 0 20px 0',borderBottom:'1px solid var(--border)',marginBottom:24,flexWrap:'wrap'}}>
      {tabs.map(tab => (
        <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
          display:'flex',alignItems:'center',gap:6,padding:'10px 18px',
          borderRadius:10,border:'1px solid',cursor:'pointer',fontSize:13,fontWeight:600,
          fontFamily:'DM Sans, sans-serif',transition:'all 0.15s',
          background: activeTab===tab.id ? 'var(--cyan)' : 'var(--surface)',

        </button>
      ))}

}

function SalaryTab({ apiKey }) {
  const [jobTitle, setJobTitle] = React.useState('');
  const [company, setCompany] = React.useState('');
  const [location, setLocation] = React.useState('São Paulo');
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [error, setError] = React.useState(null);
  const analyze = async () => {
    if (!jobTitle.trim()||!apiKey){setError(!apiKey?'Configure sua API Key na aba Configuração.':'Informe o cargo.');return;}
    setLoading(true);setError(null);setResult(null);
    try {
      const prompt = 'Pesquise na web a faixa salarial atual no Brasil para: CARGO: '+jobTitle+', EMPRESA: '+(company||'não informada')+', LOCAL: '+location+'. Responda APENAS JSON: {"market_min":<número>,"market_median":<número>,"market_max":<número>,"analysis":"<2-3 frases>","sources":["<fonte>"]}';
      const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1200,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:prompt}]})});
      const data = await r.json();
      const texts=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
      const text=texts[texts.length-1]||'';
      const match=text.match(/\{[\s\S]*\}/);
      if(!match)throw new Error('Sem resultado');
      setResult(JSON.parse(match[0]));
    }catch(e){setError(e.message);}
    setLoading(false);
  };
  const fmt=n=>n?'R$ '+Math.round(n).toLocaleString('pt-BR'):'—';
  return (
    <div>
      <div className="ai-card" style={{marginBottom:16}}>
        <div className="card-tag" style={{marginBottom:8}}>ANÁLISE SALARIAL COM IA</div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:12,marginBottom:12}}>
          <div><label style={{fontSize:11,color:'var(--muted)',letterSpacing:'0.1em',fontFamily:'JetBrains Mono,monospace'}}>CARGO *</label><input value={jobTitle} onChange={e=>setJobTitle(e.target.value)} placeholder="Ex: Superintendente" style={{width:'100%',padding:'10px 14px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:13,marginTop:4,boxSizing:'border-box'}}/></div>
          <div><label style={{fontSize:11,color:'var(--muted)',letterSpacing:'0.1em',fontFamily:'JetBrains Mono,monospace'}}>EMPRESA</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Ex: B3" style={{width:'100%',padding:'10px 14px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:13,marginTop:4,boxSizing:'border-box'}}/></div>
          <div><label style={{fontSize:11,color:'var(--muted)',letterSpacing:'0.1em',fontFamily:'JetBrains Mono,monospace'}}>CIDADE</label><input value={location} onChange={e=>setLocation(e.target.value)} placeholder="São Paulo" style={{width:'100%',padding:'10px 14px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:13,marginTop:4,boxSizing:'border-box'}}/></div>
        </div>
        <button onClick={analyze} disabled={loading||!jobTitle.trim()} style={{padding:'10px 24px',background:'linear-gradient(135deg,#00e5ff,#0080ff)',border:'none',borderRadius:10,color:'#000',fontSize:13,fontWeight:700,cursor:loading?'not-allowed':'pointer',opacity:loading?0.6:1}}>{loading?'🔍 Pesquisando...':'🔍 Pesquisar Salário'}</button>
        {error && <div style={{color:'var(--red)',fontSize:13,marginTop:8}}>{error}</div>}
      </div>
      {result && (
        <div className="ai-card">
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
            {[['Mínimo/mês','market_min','var(--muted)'],['Mediana/mês','market_median','var(--gold)'],['Máximo/mês','market_max','var(--green)']].map(([label,key,color])=>(
              <div key={key} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:12,padding:'14px',textAlign:'center'}}>
                <div style={{fontSize:10,color:'var(--muted)',letterSpacing:'0.12em',fontFamily:'JetBrains Mono,monospace',marginBottom:6}}>{label}</div>
                <div style={{fontFamily:'Syne,sans-serif',fontWeight:800,fontSize:20,color}}>{fmt(result[key])}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:13,color:'var(--text)',lineHeight:1.7,marginBottom:12}}>{result.analysis}</div>
          {result.sources&&result.sources.map((s,i)=><div key={i} style={{fontSize:11,color:'var(--cyan)'}}>• {s}</div>)}
        </div>
      )}
    </div>
  );
}

function ConfigTab({ apiKey, setApiKey }) {
  const [show, setShow] = React.useState(false);
  const [saved, setSaved] = React.useState(false);
  const save=()=>{localStorage.setItem('ats_mvp_key',apiKey);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  return (
    <div className="ai-card">
      <div className="card-tag" style={{marginBottom:8}}>API KEY — ANTHROPIC</div>
      <p style={{color:'var(--muted)',fontSize:13,marginBottom:16,lineHeight:1.6}}>Necessária para análise com Claude AI, reescrita e análise salarial. Obtenha em <a href="https://console.anthropic.com/settings/keys" target="_blank" style={{color:'var(--cyan)'}}>console.anthropic.com</a></p>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input type={show?'text':'password'} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..." style={{flex:1,padding:'10px 14px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:13,fontFamily:'JetBrains Mono,monospace'}}/>
        <button onClick={()=>setShow(!show)} style={{padding:'10px 14px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--muted)',cursor:'pointer'}}>{show?'🙈':'👁️'}</button>
        <button onClick={save} style={{padding:'10px 20px',background:'linear-gradient(135deg,#00e5ff,#0080ff)',border:'none',borderRadius:8,color:'#000',fontSize:13,fontWeight:700,cursor:'pointer'}}>{saved?'✅ Salvo!':'Salvar'}</button>
      </div>
      {apiKey?<div style={{fontSize:12,color:'var(--green)'}}>✅ API Key configurada.</div>:<div style={{fontSize:12,color:'var(--muted)'}}>⚠️ Sem API Key — usando análise local.</div>}
    </div>
  );
}

function RewriteTab({ apiKey }) {
  const [cvText,setCvText]=React.useState('');
  const [jdText,setJdText]=React.useState('');
  const [loading,setLoading]=React.useState(false);
  const [rewrite,setRewrite]=React.useState(null);
  const [error,setError]=React.useState(null);
  const [copied,setCopied]=React.useState('');
  const run=async()=>{
    if(!cvText.trim()||!jdText.trim())return;
    if(!apiKey){setError('Configure sua API Key.');return;}
    setLoading(true);setError(null);setRewrite(null);
    try{const r=await claudeRewriteCV(cvText,jdText,[],'pt',apiKey);setRewrite(r);}
    catch(e){setError(e.message);}
    setLoading(false);
  };
  const copy=(key,text)=>{navigator.clipboard.writeText(text);setCopied(key);setTimeout(()=>setCopied(''),2000);};
  return (
    <div>
      <div className="ai-card" style={{marginBottom:16}}>
        <div className="card-tag" style={{marginBottom:8}}>REESCRITA DE CV COM CLAUDE AI</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div><label style={{fontSize:11,color:'var(--muted)',letterSpacing:'0.1em',fontFamily:'JetBrains Mono,monospace'}}>SEU CURRÍCULO</label><textarea value={cvText} onChange={e=>setCvText(e.target.value)} placeholder="Cole o texto do seu currículo..." rows={10} style={{width:'100%',padding:'10px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:12,marginTop:4,resize:'vertical',boxSizing:'border-box',lineHeight:1.5}}/></div>
          <div><label style={{fontSize:11,color:'var(--muted)',letterSpacing:'0.1em',fontFamily:'JetBrains Mono,monospace'}}>DESCRIÇÃO DA VAGA</label><textarea value={jdText} onChange={e=>setJdText(e.target.value)} placeholder="Cole a descrição da vaga..." rows={10} style={{width:'100%',padding:'10px',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text)',fontSize:12,marginTop:4,resize:'vertical',boxSizing:'border-box',lineHeight:1.5}}/></div>
        </div>
        <button onClick={run} disabled={loading||!cvText.trim()||!jdText.trim()} style={{padding:'10px 24px',background:'linear-gradient(135deg,#10d9a0,#00e5ff)',border:'none',borderRadius:10,color:'#000',fontSize:13,fontWeight:700,cursor:loading?'not-allowed':'pointer',opacity:loading?0.6:1}}>{loading?'✍️ Reescrevendo...':'✍️ Reescrever CV com IA'}</button>
        {error&&<div style={{color:'var(--red)',fontSize:13,marginTop:8}}>{error}</div>}
      </div>
      {rewrite&&(
        <div className="rewrite-sections">
          {[['summary','📋 RESUMO PROFISSIONAL'],['experience','🧩 EXPERIÊNCIA (BULLETS)'],['skills','⚙️ COMPETÊNCIAS'],['keywords','🔑 PALAVRAS-CHAVE'],['checklist','✅ AJUSTES NO ARQUIVO FINAL']].filter(([key])=>rewrite[key]).map(([key,label])=>(
            <div key={key} className="rewrite-section-card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div className="rewrite-section-label">{label}</div>
                <button className={"btn-copy "+(copied===key?'copied':'')} style={{fontSize:11,padding:'5px 10px'}} onClick={()=>copy(key,rewrite[key])}><Icon name={copied===key?'check':'copy'} size={12}/> {copied===key?'Copiado!':'Copiar'}</button>
              </div>
              <div className="rewrite-section-text">{rewrite[key]}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function HistoryTabPage({ onLoad }) {
  const [list,setList]=React.useState(loadHistory());
  const refresh=()=>setList(loadHistory());
  const scoreColor=s=>s>=70?'#10d9a0':s>=50?'#fbbf24':'#f87171';
  if(list.length===0)return(<div className="ai-card" style={{textAlign:'center',padding:48,color:'var(--muted)'}}><div style={{fontSize:32,marginBottom:12}}>📂</div><div>Nenhuma análise salva ainda.</div></div>);
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{fontFamily:'Syne,sans-serif',fontWeight:700,fontSize:18,color:'var(--text-bright)'}}>Histórico</div>
        <button onClick={()=>{clearHistory();refresh();}} style={{fontSize:12,color:'var(--red)',background:'transparent',border:'none',cursor:'pointer'}}>Limpar tudo</button>
      </div>
      <div className="history-list">
        {list.map(h=>(
          <div key={h.id} className="history-item" onClick={()=>onLoad(h)}>
            <div className="history-score-badge" style={{background:scoreColor(h.score)+'20',color:scoreColor(h.score),border:'1px solid '+scoreColor(h.score)+'50'}}>{h.score}%</div>
            <div className="history-info"><div className="history-job">{h.jobTitle}</div><div className="history-date">{new Date(h.timestamp).toLocaleString()}</div></div>
            <button className="history-del" onClick={e=>{e.stopPropagation();deleteFromHistory(h.id);refresh();}}><Icon name="close" size={12}/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState('pt');
  const [activeTab, setActiveTab] = useState('analyze');
  const [page, setPage] = useState('input');
  const [result, setResult] = useState(null);
  const [apiKey, setApiKey] = useState(localStorage.getItem('ats_mvp_key') || '');
  const [lastCvText, setLastCvText] = useState('');
  const [lastJdText, setLastJdText] = useState('');
  const [historyCount, setHistoryCount] = useState(loadHistory().length);
  const t = i18n[lang];

  const onAnalyze = async (cvText, jdText, key) => {
    setPage('processing');
    setLastCvText(cvText);
    setLastJdText(jdText);
    const effectiveKey = key || apiKey;
    await new Promise(r => setTimeout(r, effectiveKey ? 2000 : 4500));
    let analysis;
    if (effectiveKey) {
      try { analysis = await claudeAnalyze(cvText, jdText, lang, effectiveKey); }
      catch (e) { analysis = smartAnalyze(cvText, jdText, lang); analysis.analyzeError = e.message; }
    } else {
      analysis = smartAnalyze(cvText, jdText, lang);
    }
    saveToHistory(analysis);
    setHistoryCount(loadHistory().length);
    setResult(analysis);
    setPage('results');
  };

  const onBack = () => setPage('input');
  const onNew = () => { setResult(null); setPage('input'); };
  const onLoadHistory = (entry) => { setResult(entry); setPage('results'); setActiveTab('analyze'); };

  return (
    <div>
      <Header t={t} lang={lang} setLang={setLang}/>
      <div className="container">
        <NavTabs activeTab={activeTab} setActiveTab={tab => { setActiveTab(tab); if (tab==='analyze') setPage('input'); }} t={t} historyCount={historyCount}/>
        {activeTab === 'analyze' && (
          <>
            {page === 'input' && <InputPage t={t} lang={lang} onAnalyze={onAnalyze} apiKey={apiKey} setApiKey={setApiKey}/>}
            {page === 'processing' && <ProcessingPage t={t}/>}
            {page === 'results' && result && <ResultsPage result={result} t={t} onBack={onBack} onNew={onNew} apiKey={apiKey} cvText={lastCvText} jdText={lastJdText} onLoadHistory={onLoadHistory}/>}
          </>
        )}
        {activeTab === 'history' && <HistoryTabPage onLoad={onLoadHistory}/>}
        {activeTab === 'rewrite' && <RewriteTab apiKey={apiKey}/>}
        {activeTab === 'salary' && <SalaryTab apiKey={apiKey}/>}
        {activeTab === 'config' && <ConfigTab apiKey={apiKey} setApiKey={v=>{setApiKey(v);localStorage.setItem('ats_mvp_key',v);}}/>}
      </div>
      <div className="footer-meta">
        <span>✦</span> {t.footer} <span>✦</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
